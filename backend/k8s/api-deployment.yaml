# API Deployment and Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: codecourt
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      serviceAccountName: api-service-account
      containers:
      - name: api
        image: 501588780051.dkr.ecr.us-east-1.amazonaws.com/codecourt-backend:latest
        securityContext:
          runAsUser: 0
        ports:
        - containerPort: 5000
        envFrom:
        - configMapRef:
            name: codecourt-config
        - secretRef:
            name: codecourt-secrets
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 60
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 15
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: codecourt
spec:
  selector:
    app: api
  ports:
  - port: 5000
    targetPort: 5000
  type: LoadBalancer
