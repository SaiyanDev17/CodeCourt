apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-service-account
  namespace: codecourt
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: api-judge-manager
  namespace: codecourt
rules:
- apiGroups: [""]
  resources: ["pods", "pods/log"]
  verbs: ["create", "get", "list", "watch", "delete"]
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["create", "get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: api-judge-manager-binding
  namespace: codecourt
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: api-judge-manager
subjects:
- kind: ServiceAccount
  name: api-service-account
  namespace: codecourt
